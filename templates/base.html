<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FareWatch</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
</head>
<body>

  <header class="header">
    <a href="/" class="logo">fare<span>watch</span></a>
    <nav class="nav">
      <a href="/" class="{{ 'active' if request.path == '/' }}">flights</a>
      <a href="/hotels" class="{{ 'active' if request.path == '/hotels' }}">hotels</a>
      <a href="/trends" class="{{ 'active' if request.path == '/trends' }}">trends</a>
      <a href="#" class="">clients</a>
      <a href="/usage" class="{{ 'active' if request.path == '/usage' }}">usage</a>
      <a href="#" class="">settings</a>
      <a href="/logout" class="nav-logout">log out</a>
    </nav>
  </header>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for msg in messages %}
        <div class="flash-bar">{{ msg }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}

</body>
</html>
