{% extends "base.html" %}
{% block content %}

<h2>Add a New Watch</h2>

<form method="POST">
  <table cellpadding="6">
    <tr>
      <td><label for="origin">Origin airport code (e.g. JFK)</label></td>
      <td><input type="text" id="origin" name="origin" maxlength="3"
                 placeholder="JFK" required style="text-transform:uppercase"></td>
    </tr>
    <tr>
      <td><label for="destination">Destination airport code (e.g. CDG)</label></td>
      <td><input type="text" id="destination" name="destination" maxlength="3"
                 placeholder="CDG" required style="text-transform:uppercase"></td>
    </tr>
    <tr>
      <td><label>Trip type</label></td>
      <td>
        <label><input type="radio" name="trip_type" value="one_way" checked onchange="toggleReturn()"> One-way</label>
        &nbsp;&nbsp;
        <label><input type="radio" name="trip_type" value="round_trip" onchange="toggleReturn()"> Round-trip</label>
      </td>
    </tr>
    <tr>
      <td><label for="date_from">Earliest departure date</label></td>
      <td><input type="date" id="date_from" name="date_from" required></td>
    </tr>
    <tr>
      <td><label for="date_to">Latest departure date</label></td>
      <td><input type="date" id="date_to" name="date_to" required></td>
    </tr>
    <tr id="return_dates_row" style="display:none">
      <td><label for="return_date_from">Earliest return date</label></td>
      <td><input type="date" id="return_date_from" name="return_date_from"></td>
    </tr>
    <tr id="return_dates_row2" style="display:none">
      <td><label for="return_date_to">Latest return date</label></td>
      <td><input type="date" id="return_date_to" name="return_date_to"></td>
    </tr>
    <tr>
      <td><label for="passengers">Number of passengers</label></td>
      <td><input type="number" id="passengers" name="passengers"
                 min="1" max="9" value="1" required></td>
    </tr>
    <tr>
      <td><label for="target_price">Target price (per person, USD)</label></td>
      <td><input type="number" id="target_price" name="target_price"
                 min="1" step="0.01" placeholder="500.00" required></td>
    </tr>
    <tr>
      <td><label for="client_name">Client name</label></td>
      <td><input type="text" id="client_name" name="client_name" required></td>
    </tr>
    <tr>
      <td><label for="client_email">Client email</label></td>
      <td><input type="email" id="client_email" name="client_email" required></td>
    </tr>
  </table>

  <br>
  <button type="submit">Add Watch</button>
  <a href="/">Cancel</a>
</form>

<script>
function toggleReturn() {
  const isRoundTrip = document.querySelector('input[name="trip_type"]:checked').value === 'round_trip';
  document.getElementById('return_dates_row').style.display = isRoundTrip ? '' : 'none';
  document.getElementById('return_dates_row2').style.display = isRoundTrip ? '' : 'none';
  document.getElementById('return_date_from').required = isRoundTrip;
  document.getElementById('return_date_to').required = isRoundTrip;
}
</script>

{% endblock %}
