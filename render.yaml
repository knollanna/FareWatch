services:
  # --- Web app ---
  - type: web
    name: farewatch
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: free
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: DUFFEL_API_TOKEN
        sync: false
      - key: LITEAPI_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: BASE_URL
        value: https://farewatch.annaknoll.com
      - key: RENDER_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.14.5

  # --- Price checker cron job (every 2 hours, 24/7 for trend data) ---
  - type: cron
    name: farewatch-price-check
    runtime: python
    buildCommand: pip install -r requirements.txt
    schedule: "0 */2 * * *"
    startCommand: python check_prices.py
    plan: free
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: DUFFEL_API_TOKEN
        sync: false
      - key: LITEAPI_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: BASE_URL
        value: https://farewatch.annaknoll.com
      - key: PYTHON_VERSION
        value: 3.14.5
